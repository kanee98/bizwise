name: Deploy Bizwise

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package app
        run: git archive --format=tar.gz --output=release.tar.gz HEAD

      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "release.tar.gz"
          target: "/home/bizwisel"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            APP_DIR="/home/bizwisel/bizwise"
            PKG="/home/bizwisel/release.tar.gz"
            TMP="/home/bizwisel/bizwise_tmp_deploy"

            rm -rf "$TMP"
            mkdir -p "$TMP"
            tar -xzf "$PKG" -C "$TMP"

            rsync -a --delete \
              --exclude=.env \
              --exclude=.env.* \
              --exclude=node_modules \
              --exclude=.next \
              "$TMP"/ "$APP_DIR"/

            cd "$APP_DIR"
            npm ci
            npm run build
            mkdir -p tmp
            touch tmp/restart.txt

            rm -rf "$TMP"
            rm -f "$PKG"
